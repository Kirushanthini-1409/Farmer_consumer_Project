<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Marketplace</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">

    <nav class="bg-white px-6 py-4 shadow-sm flex justify-between items-center sticky top-0 z-50">
        <div class="font-bold text-xl text-green-700"><i class="fas fa-leaf"></i> Market</div>
        <button onclick="logout()" class="text-gray-600 hover:text-red-500 font-bold">Logout</button>
        <a href="analytics.html" class="bg-white text-green-700 px-4 py-1 rounded font-bold text-sm mr-2">
            Analytics
        </a>
    </nav>

    <div class="max-w-6xl mx-auto p-4">
        
        <div class="bg-gray-200 h-48 rounded-xl mb-8 flex items-center justify-center text-gray-500 border-2 border-dashed border-gray-400">
            <div class="text-center">
                <i class="fas fa-map-marker-alt text-3xl mb-2"></i>
                <p>Google Maps Area</p>
                <p class="text-xs">(Requires API Key for live view)</p>
            </div>
        </div>

        <h2 class="text-2xl font-bold mb-6 text-gray-800">Fresh Near You</h2>

        <div id="market-grid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <div class="col-span-full text-center py-10 text-gray-500">Loading products...</div>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <script>
        // --- PASTE CONFIG HERE ---
        const firebaseConfig = {
            apiKey: "AIzaSyDdcoeskwx7B-zQoTNS7B5kmkFrnd9X1dg",
            authDomain: "farmconnect-86377.firebaseapp.com",
            projectId: "farmconnect-86377",
            storageBucket: "farmconnect-86377.firebasestorage.app",
            messagingSenderId: "1008958287296",
            appId: "1:1008958287296:web:09f5825e269536b7b0ec25"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        function logout() {
            auth.signOut().then(() => window.location.href = "index.html");
        }

        // Load Products
        db.collection('products').orderBy('createdAt', 'desc').get().then((snap) => {
            const grid = document.getElementById('market-grid');
            grid.innerHTML = ""; // Clear loader
            
            if(snap.empty) {
                grid.innerHTML = `<div class="col-span-full text-center">No products listed yet.</div>`;
                return;
            }

            snap.forEach(doc => {
                const data = doc.data();
                const html = `
                    <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition">
                        <img src="${data.image}" class="w-full h-48 object-cover">
                        <div class="p-4">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-bold text-lg">${data.name}</h3>
                                <span class="bg-green-100 text-green-800 text-xs px-2 py-1 rounded-full">${data.type}</span>
                            </div>
                            <div class="flex justify-between items-center mt-4">
                                <span class="text-xl font-bold text-gray-800">₹${data.price}<span class="text-sm font-normal text-gray-500">/kg</span></span>
                                <button onclick="buyItem('${data.name}')" class="bg-green-600 text-white px-3 py-1 rounded hover:bg-green-700">
                                    Buy
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += html;
            });
        });

        function buyItem(name) {
            alert("Order placed for " + name + "!");
        }
    </script>
</body>
</html>
