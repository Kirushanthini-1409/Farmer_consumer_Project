<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Farmer Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">

    <nav class="bg-green-700 text-white p-4 shadow-lg flex justify-between items-center">
        <h1 class="text-xl font-bold"><i class="fas fa-tractor"></i> Farmer Portal</h1>
        <button onclick="logout()" class="bg-white text-green-700 px-4 py-1 rounded font-bold text-sm">Logout</button>
        <a href="analytics.html" class="bg-white text-green-700 px-4 py-1 rounded font-bold text-sm mr-2">
            Analytics
        </a>
    </nav>

    <div class="max-w-4xl mx-auto p-4 mt-6">
        
        <div class="bg-white rounded-xl shadow-md p-6 mb-8">
            <h2 class="text-xl font-bold mb-4 text-gray-800 border-b pb-2">Add New Harvest</h2>
            <form id="addForm" class="grid md:grid-cols-2 gap-4">
                <input type="text" id="pName" placeholder="Product Name (e.g. Tomatoes)" class="border p-2 rounded" required>
                <input type="number" id="pPrice" placeholder="Price (₹ per kg)" class="border p-2 rounded" required>
                <select id="pType" class="border p-2 rounded">
                    <option value="Fresh">Fresh Quality</option>
                    <option value="Ugly">"Ugly" (Discounted)</option>
                </select>
                <input type="text" id="pImg" value="https://source.unsplash.com/random/300x200/?vegetable" class="border p-2 rounded text-gray-500">
                
                <button type="submit" class="md:col-span-2 bg-green-600 text-white py-2 rounded font-bold hover:bg-green-700">
                    <i class="fas fa-plus"></i> List Product
                </button>
            </form>
        </div>

        <h3 class="text-lg font-bold mb-4">Your Listings</h3>
        <div id="products-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <script>
        // --- PASTE CONFIG HERE ---
        const firebaseConfig = {
            apiKey: "AIzaSyDdcoeskwx7B-zQoTNS7B5kmkFrnd9X1dg",
            authDomain: "farmconnect-86377.firebaseapp.com",
            projectId: "farmconnect-86377",
            storageBucket: "farmconnect-86377.firebasestorage.app",
            messagingSenderId: "1008958287296",
            appId: "1:1008958287296:web:09f5825e269536b7b0ec25"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        function logout() {
            auth.signOut().then(() => window.location.href = "index.html");
        }

        // Add Product Logic
        document.getElementById('addForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('pName').value;
            const price = document.getElementById('pPrice').value;
            const type = document.getElementById('pType').value;
            const img = document.getElementById('pImg').value;

            db.collection('products').add({
                name: name,
                price: price,
                type: type,
                image: img,
                farmerId: auth.currentUser ? auth.currentUser.uid : 'guest',
                createdAt: new Date()
            }).then(() => {
                alert("Product Listed Successfully!");
                document.getElementById('addForm').reset();
                loadProducts(); // Refresh list
            });
        });

        // Load Products Logic
        function loadProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = ""; // Clear
            
            // Only show products by THIS user (in real app) - for demo show all
            db.collection('products').orderBy('createdAt', 'desc').get().then((snap) => {
                snap.forEach(doc => {
                    const data = doc.data();
                    const html = `
                        <div class="bg-white p-4 rounded-lg shadow flex items-center gap-4">
                            <img src="${data.image}" class="w-16 h-16 rounded object-cover">
                            <div class="flex-1">
                                <h4 class="font-bold">${data.name}</h4>
                                <span class="text-xs bg-green-100 text-green-800 px-2 py-1 rounded">${data.type}</span>
                            </div>
                            <div class="font-bold text-green-700">₹${data.price}</div>
                        </div>
                    `;
                    container.innerHTML += html;
                });
            });
        }

        // Initial Load
        auth.onAuthStateChanged(user => {
            if(user) loadProducts();
            else window.location.href = "login.html";
        });

    </script>
</body>
</html>
