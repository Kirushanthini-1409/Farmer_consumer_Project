<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - FarmConnect</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-xl">
        <h2 class="text-3xl font-bold text-center mb-6 text-gray-800">Welcome Back</h2>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-bold text-gray-700">Email</label>
                <input type="email" id="email" class="w-full p-3 border rounded-lg mt-1" required>
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700">Password</label>
                <input type="password" id="password" class="w-full p-3 border rounded-lg mt-1" required>
            </div>
            
            <button type="submit" id="btn" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 transition">Sign In</button>
        </form>
        <p class="text-center mt-4">New here? <a href="register.html" class="text-green-600 font-bold">Create Account</a></p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <script>
        // --- PASTE CONFIG HERE ---
        const firebaseConfig = {
            apiKey: "AIzaSyDdcoeskwx7B-zQoTNS7B5kmkFrnd9X1dg",
            authDomain: "farmconnect-86377.firebaseapp.com",
            projectId: "farmconnect-86377",
            storageBucket: "farmconnect-86377.firebasestorage.app",
            messagingSenderId: "1008958287296",
            appId: "1:1008958287296:web:09f5825e269536b7b0ec25"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // LOGIC
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn');
            btn.innerText = "Verifying...";
            btn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    btn.innerText = "Checking Role...";
                    // Check Database for Role
                    return db.collection("users").doc(userCredential.user.uid).get();
                })
                .then((doc) => {
                    if (doc.exists) {
                        const role = doc.data().role;
                        if (role === 'farmer') {
                            window.location.href = "farmer-dashboard.html";
                        } else {
                            window.location.href = "consumer-dashboard.html";
                        }
                    } else {
                        // Fallback if data missing
                        console.log("No data found, defaulting to consumer");
                        window.location.href = "consumer-dashboard.html";
                    }
                })
                .catch((error) => {
                    console.error(error);
                    alert("Login Failed: " + error.message);
                    btn.innerText = "Sign In";
                    btn.disabled = false;
                });
        });
    </script>
</body>
</html>
