<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - FarmConnect</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .role-card.selected { border-color: #16a34a; background-color: #f0fdf4; color: #16a34a; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-xl">
        <h2 class="text-3xl font-bold text-center mb-2">Join Us</h2>
        <p class="text-center text-gray-500 mb-6">Create your account</p>

        <div class="grid grid-cols-2 gap-4 mb-6">
            <div onclick="selectRole('farmer')" id="card-farmer" class="role-card border-2 border-gray-200 p-4 rounded-xl text-center cursor-pointer hover:border-green-300 transition">
                <i class="fas fa-tractor text-3xl mb-2"></i>
                <div class="font-bold">Farmer</div>
            </div>
            <div onclick="selectRole('consumer')" id="card-consumer" class="role-card border-2 border-gray-200 p-4 rounded-xl text-center cursor-pointer hover:border-green-300 transition selected">
                <i class="fas fa-shopping-basket text-3xl mb-2"></i>
                <div class="font-bold">Consumer</div>
            </div>
        </div>

        <form id="regForm" class="space-y-4">
            <input type="text" id="name" placeholder="Full Name" class="w-full p-3 border rounded-lg" required>
            <input type="email" id="email" placeholder="Email Address" class="w-full p-3 border rounded-lg" required>
            <input type="text" id="location" placeholder="City/Location" class="w-full p-3 border rounded-lg" required>
            <input type="password" id="password" placeholder="Password (Min 6 chars)" class="w-full p-3 border rounded-lg" required>
            
            <button type="submit" id="btn" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 transition">Create Account</button>
        </form>
        <p class="text-center mt-4">Already a member? <a href="login.html" class="text-green-600 font-bold">Login</a></p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <script>


        const firebaseConfig = {
            apiKey: "AIzaSyDdcoeskwx7B-zQoTNS7B5kmkFrnd9X1dg",
            authDomain: "farmconnect-86377.firebaseapp.com",
            projectId: "farmconnect-86377",
            storageBucket: "farmconnect-86377.firebasestorage.app",
            messagingSenderId: "1008958287296",
            appId: "1:1008958287296:web:09f5825e269536b7b0ec25"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // LOGIC
        let selectedRole = 'consumer';

        function selectRole(role) {
            selectedRole = role;
            document.getElementById('card-farmer').classList.remove('selected');
            document.getElementById('card-consumer').classList.remove('selected');
            document.getElementById('card-' + role).classList.add('selected');
        }

        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn');
            btn.innerText = "Creating...";
            btn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const name = document.getElementById('name').value;
            const location = document.getElementById('location').value;

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // Save to Firestore
                    return db.collection("users").doc(userCredential.user.uid).set({
                        name: name,
                        email: email,
                        role: selectedRole,
                        location: location,
                        createdAt: new Date().toISOString()
                    });
                })
                .then(() => {
                    alert("Account Created! Please Login.");
                    window.location.href = "login.html";
                })
                .catch((error) => {
                    console.error(error);
                    alert("Error: " + error.message);
                    btn.innerText = "Create Account";
                    btn.disabled = false;
                });
        });
    </script>
</body>
</html>
