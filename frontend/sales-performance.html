<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Performance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <script type="module" src="firebase-config.js"></script>
</head>
<body class="bg-gray-50 font-sans">

    <nav class="bg-green-700 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-4">
            <a href="farmer-dashboard.html" class="hover:text-green-200"><i class="fas fa-arrow-left"></i> Back</a>
            <span class="font-bold text-xl">Monthly Sales Report</span>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 py-8">
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-md border-b-4 border-green-500">
                <h3 class="text-gray-500">Total Sales (Year)</h3>
                <p class="text-3xl font-bold text-gray-800">₹ 4,50,000</p>
                <p class="text-green-500 text-sm mt-2"><i class="fas fa-arrow-up"></i> 12% vs last year</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-md border-b-4 border-blue-500">
                <h3 class="text-gray-500">Top Product</h3>
                <p class="text-3xl font-bold text-gray-800">Tomatoes</p>
                <p class="text-blue-500 text-sm mt-2">1,200 kg sold</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-md border-b-4 border-purple-500">
                <h3 class="text-gray-500">Waste Saved</h3>
                <p class="text-3xl font-bold text-gray-800">850 kg</p>
                <p class="text-purple-500 text-sm mt-2">Via "Ugly" Produce</p>
            </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-lg">
            <h2 class="text-xl font-bold mb-6 text-gray-800">Revenue Overview</h2>
            <div class="h-80 w-full">
                <canvas id="salesChart"></canvas>
            </div>
        </div>

    </div>

    <script>
        // Initialize Chart
        const ctx = document.getElementById('salesChart').getContext('2d');
        const salesChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug'],
                datasets: [{
                    label: 'Revenue (₹)',
                    data: [35000, 42000, 38000, 45000, 52000, 60000, 58000, 65000], // Static data for Demo
                    borderColor: '#15803d', // Green-700
                    backgroundColor: 'rgba(21, 128, 61, 0.1)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: { color: '#f3f4f6' }
                    }
                }
            }
        });
    </script>
</body>
</html>
