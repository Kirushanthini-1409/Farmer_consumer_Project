<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Savings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script type="module" src="firebase-config.js"></script>
</head>
<body class="bg-purple-50 font-sans">

    <nav class="bg-purple-700 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-2">
            <a href="consumer-dashboard.html" class="text-white"><i class="fas fa-arrow-left"></i> Back</a>
            <span class="font-bold text-xl ml-4">Community Deals</span>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 py-10">
        <h1 class="text-3xl font-bold text-purple-900 mb-2">Bulk Buying</h1>
        <p class="text-gray-600 mb-8">Join neighbors to unlock wholesale prices.</p>

        <div class="bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row">
            <div class="md:w-1/3 bg-gray-200 relative">
                <img src="https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&w=600" class="w-full h-full object-cover">
                <div class="absolute top-0 left-0 bg-red-500 text-white px-3 py-1 text-sm font-bold rounded-br-lg">
                    Expires in 24h
                </div>
            </div>
            
            <div class="p-8 md:w-2/3">
                <div class="flex justify-between items-start">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-800">Premium Basmati Rice (25kg)</h2>
                        <p class="text-gray-500">From Krishna Farms, Tanjore</p>
                    </div>
                    <div class="text-right">
                        <div class="text-3xl font-bold text-purple-700">₹1,200</div>
                        <div class="text-sm text-gray-400 line-through">Retail: ₹1,600</div>
                    </div>
                </div>

                <div class="mt-6">
                    <div class="flex justify-between text-sm font-bold mb-1">
                        <span class="text-purple-700" id="joined-count">1 joined</span>
                        <span class="text-gray-400">Target: 5</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-4">
                        <div id="progress-bar" class="bg-purple-600 h-4 rounded-full transition-all duration-500" style="width: 20%"></div>
                    </div>
                    <p class="text-xs text-gray-500 mt-2">4 more people needed to activate this deal.</p>
                </div>

                <button id="join-btn" class="mt-8 w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-xl transition transform active:scale-95">
                    Join Group Deal (Pay Later)
                </button>
            </div>
        </div>
    </div>

    <script>
        // Simple Interaction Logic (No complex DB for speed)
        let count = 1;
        const target = 5;
        const btn = document.getElementById('join-btn');
        const progress = document.getElementById('progress-bar');
        const text = document.getElementById('joined-count');

        btn.addEventListener('click', () => {
            if(count < target) {
                count++;
                const percentage = (count / target) * 100;
                
                // Update UI
                progress.style.width = percentage + "%";
                text.innerText = count + " joined";
                
                btn.innerText = "You have joined! Waiting for others...";
                btn.classList.remove('bg-purple-600');
                btn.classList.add('bg-green-600');
                btn.disabled = true;

                if(count === target) {
                    alert("Deal Unlocked! Wholesale price activated.");
                }
            }
        });
    </script>
</body>
</html>
