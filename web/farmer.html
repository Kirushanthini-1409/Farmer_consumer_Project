<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Farmer Dashboard — FarmConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>

<div class="container my-4">
  <div class="row g-3">
    <div class="col-md-4">
      <div class="card p-3 text-center">
        <div class="fs-1">🌱</div>
        <div class="fs-2 fw-bold text-success" id="kgSaved">0</div>
        <div>kg saved from waste (your ugly-produce sales)</div>
        <div id="kycStatus" class="mt-2"></div>
      </div>
    </div>
    <div class="col-md-8">
      <div class="card p-3">
        <h6>📈 In demand this week <small class="text-muted" id="demandNote"></small></h6>
        <div id="demandChips"></div>
      </div>
    </div>
  </div>

  <div class="row g-3 mt-1">
    <div class="col-lg-5">
      <div class="card p-3 mb-3">
        <h5>Add product</h5>
        <form id="productForm">
          <div class="row g-2">
            <div class="col-7"><input class="form-control" id="pName" placeholder="Product name (e.g., Tomato)" required></div>
            <div class="col-5">
              <select class="form-select" id="pCategory">
                <option value="vegetable">Vegetable</option><option value="fruit">Fruit</option>
                <option value="dairy">Dairy</option><option value="eggs">Eggs</option>
                <option value="grains">Grains</option><option value="homemade">Homemade</option>
              </select></div>
            <div class="col-7"><input class="form-control" id="pPrice" type="number" step="0.5" placeholder="Base price ₹" required></div>
            <div class="col-5"><input class="form-control" id="pUnit" placeholder="Unit" value="kg"></div>
            <div class="col-12"><input class="form-control" id="pDesc" placeholder="Short description"></div>
            <div class="col-12"><input class="form-control" type="file" accept="image/*" id="pImage"></div>
          </div>
          <button class="btn btn-success mt-2">Add product</button>
        </form>
      </div>

      <div class="card p-3">
        <h5>Add inventory batch</h5>
        <form id="batchForm">
          <select class="form-select mb-2" id="bProduct" required></select>
          <div class="row g-2">
            <div class="col-4"><input class="form-control" id="bQty" type="number" step="0.5" placeholder="Qty" required></div>
            <div class="col-4"><input class="form-control" id="bPrice" type="number" step="0.5" placeholder="₹/unit" required></div>
            <div class="col-4"><input class="form-control" id="bHarvest" type="date" required></div>
          </div>
          <div class="form-check form-switch my-2">
            <input class="form-check-input" type="checkbox" id="bUgly">
            <label class="form-check-label">🥕 Ugly but Tasty batch (mandatory 30–50% discount)</label>
          </div>
          <div id="uglyDiscountRow" class="mb-2" style="display:none">
            <label class="form-label small">Discount: <span id="bDiscountVal">30</span>%</label>
            <input type="range" class="form-range" id="bDiscount" min="30" max="50" value="30">
          </div>
          <div class="alert alert-info py-2" id="priceBand" style="display:none"></div>
          <button class="btn btn-success">Add batch</button>
        </form>
      </div>
    </div>

    <div class="col-lg-7">
      <div class="card p-3 mb-3">
        <h5>Your batches</h5>
        <div class="table-responsive"><table class="table table-sm">
          <thead><tr><th>Product</th><th>Stock</th><th>Price</th><th>Freshness</th><th></th></tr></thead>
          <tbody id="batchRows"></tbody>
        </table></div>
      </div>
      <div class="card p-3">
        <h5>Open a group buy</h5>
        <form id="groupForm" class="row g-2">
          <div class="col-12"><select class="form-select" id="gBatch" required></select></div>
          <div class="col-3"><input class="form-control" id="gTarget" type="number" placeholder="Target qty" required></div>
          <div class="col-3"><input class="form-control" id="gPrice" type="number" step="0.5" placeholder="₹/unit" required></div>
          <div class="col-3"><input class="form-control" id="gDeadline" type="datetime-local" required></div>
          <div class="col-3"><input class="form-control" id="gRadius" type="number" value="10" title="Radius km"></div>
          <div class="col-12"><button class="btn btn-success">Open group buy</button></div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/farmer.js"></script>
</body>
</html>
