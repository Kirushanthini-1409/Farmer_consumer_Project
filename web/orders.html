<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Orders — FarmConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>

<div class="container my-4">
  <h4 id="title">My Orders</h4>
  <div id="orders" class="mt-3"></div>
  <div id="emptyState" class="text-center text-muted my-5" style="display:none">
    <div class="fs-1">📦</div>No orders yet — <a href="browse.html">browse fresh produce</a> to place your first one.
  </div>
</div>

<!-- Timeline modal -->
<div class="modal fade" id="timelineModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Order timeline</h5>
      <button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><div class="timeline" id="timeline"></div></div>
  </div></div>
</div>

<!-- Review modal -->
<div class="modal fade" id="reviewModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Leave a verified-purchase review</h5>
      <button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <input type="hidden" id="rvOrder"><input type="hidden" id="rvProduct">
      <div class="mb-2"><label class="form-label">Stars</label>
        <select class="form-select" id="rvStars">
          <option value="5">★★★★★</option><option value="4">★★★★</option>
          <option value="3">★★★</option><option value="2">★★</option><option value="1">★</option>
        </select></div>
      <textarea class="form-control" id="rvText" rows="3" placeholder="How was it?"></textarea>
    </div>
    <div class="modal-footer"><button class="btn btn-success" id="rvSubmit">Submit review</button></div>
  </div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/orders.js"></script>
</body>
</html>
